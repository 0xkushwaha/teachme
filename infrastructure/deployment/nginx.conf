# Reference reverse proxy / ingress for a single-region deployment.
# Browser → https://teachme.example → nginx → frontend (:3000) and backend (/api → :4000).
# Same origin for UI and API keeps auth cookies first-party (SameSite=Lax) and avoids CORS.

upstream teachme_api {
  least_conn;
  server backend-1:4000 max_fails=3 fail_timeout=10s;
  server backend-2:4000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}
upstream teachme_web {
  server frontend:3000;
  keepalive 32;
}

# Coarse edge limit per IP; finer per-route/per-user limits are enforced in the API (Redis-backed).
limit_req_zone $binary_remote_addr zone=api_edge:20m rate=30r/s;

server {
  listen 80;
  server_name teachme.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name teachme.example;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 256k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust client-supplied XFF
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Prometheus scrapes backends directly on the private network; never expose metrics publicly.
  location = /metrics { return 404; }

  location /api/ {
    limit_req zone=api_edge burst=60 nodelay;
    proxy_read_timeout 35s;
    proxy_pass http://teachme_api;
  }

  # Razorpay webhooks: no edge rate limit (provider retries), signature checked by the API.
  location = /api/v1/payments/razorpay/webhook {
    proxy_pass http://teachme_api;
  }

  location /_next/static/ {
    proxy_pass http://teachme_web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://teachme_web;
  }
}
