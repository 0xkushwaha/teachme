# Render Blueprint — FREE tier, for client testing only. Not for real users or real money.
# Deploy: Render dashboard → New → Blueprint → select this repo (leave "Blueprint Path" empty).
# This is the DEFAULT file on purpose: Render previews render.yaml as soon as a repo is picked, so a paid
# default would demand a card before the path could be changed. The production setup is
# render.production.yaml (paid plans); switch to it before launch. See docs/deployment.md › Free tier.
#
# How this differs from render.production.yaml, and why (Render free-tier rules):
#   - No background worker: free instances don't exist for workers, so the API runs the queue
#     workers in-process (RUN_WORKERS_IN_API=true).
#   - No pre-deploy command (paid only): the API applies migrations itself on every start.
#   - Free web services can't RECEIVE private-network traffic, so the website reaches the API over
#     the API's public https URL (BACKEND_INTERNAL_URL), not the private network.
#   - Outbound SMTP ports 25/465/587 are blocked on free instances: send email on port 2525
#     (e.g. Brevo: smtp-relay.brevo.com:2525).
#   - No Shell on free instances: create the first admin from your own computer (see docs).
#
# Free-tier limits to expect: services sleep after 15 minutes without traffic (~1 minute to wake;
# background jobs such as reminders only run while the API is awake); the free database is deleted
# 30 days after creation and has no backups; Redis is in-memory only (queued jobs are rebuilt from the
# database outbox after a restart).

databases:
  - name: teachme-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: teachme
    user: teachme
    # Allows connections from outside Render so you can create the first admin from your computer.
    # Access still needs the database password. Remove (set []) once the admin exists.
    ipAllowList:
      - source: 0.0.0.0/0
        description: first-admin setup from a developer machine

services:
  - type: keyvalue
    name: teachme-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction      # required by BullMQ
    ipAllowList: []                  # private network only

  - type: web
    name: teachme-api
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Pre-deploy commands are paid-only, so migrate on start (idempotent), then run the API.
    # Kept free of quotes and shell operators: Render passes quotes in dockerCommand through literally.
    dockerCommand: npm run start:migrate
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKERS_IN_API
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Browser → Render → website → Render → API. The website passes the visitor's
      # X-Forwarded-For through unchanged, so trusting 2 hops yields the real client IP (and a
      # higher value would let visitors spoof it).
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: teachme-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teachme-redis
          property: connectionString
      # The website's public address, e.g. https://teachme-web.onrender.com (no trailing slash).
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false                  # same value as APP_URL
      - key: CORS_ORIGINS
        sync: false                  # same value as APP_URL
      # Razorpay TEST keys (rzp_test_…). Webhook URL: https://<api>.onrender.com/api/v1/payments/razorpay/webhook
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional for testing (Meet links). Redirect URI: <APP_URL>/api/v1/integrations/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Required even for testing: students must verify their email before booking.
      - key: SMTP_HOST
        sync: false                  # e.g. smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"                # 25/465/587 are blocked on free instances
      - key: SMTP_SECURE
        value: "false"               # STARTTLS
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false                  # Brevo: an SMTP key, not an API key
      - key: EMAIL_FROM
        sync: false                  # a sender address verified with your email provider
      - key: SUPPORT_EMAIL
        sync: false

  - type: web
    name: teachme-web
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      # The API's PUBLIC address, e.g. https://teachme-api.onrender.com (free web services can't
      # receive private-network traffic). Used at build time for the /api proxy and at runtime.
      - key: BACKEND_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false                  # same value as APP_URL
