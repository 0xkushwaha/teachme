# Render Blueprint — the single place that defines every production service and env var.
# Deploy: Render dashboard → New → Blueprint → select this repo. Render shows a preview (and any
# spec errors) before creating anything, and prompts for every `sync: false` value.
#
# Topology (all in the Singapore region, closest to India):
#   teachme-web     Next.js frontend — the ONLY origin browsers use; proxies /api to the API privately
#   teachme-api     NestJS API — runs migrations before each deploy; public URL used only for Razorpay webhooks
#   teachme-worker  Background worker (outbox, email, calendar/Meet, refunds, reminders)
#   teachme-db      Managed PostgreSQL 16 (daily backups; point-in-time recovery on paid plans)
#   teachme-redis   Managed Key Value (Redis-compatible), noeviction (required by BullMQ)
#
# Secrets never live in this file: random ones are generated by Render (`generateValue`), provider
# credentials are entered in the dashboard (`sync: false`). See docs/deployment.md › Render.

envVarGroups:
  # Shared by API and worker: they must use the same keys to read each other's data.
  - name: teachme-backend-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKERS_IN_API
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true          # 256-bit random, base64
      - key: DATA_ENCRYPTION_KEY
        generateValue: true          # exactly 32 bytes, base64 (AES-256-GCM for Google tokens)
      - key: METRICS_TOKEN
        generateValue: true
      # Public origin of the site, e.g. https://teachme.in (no trailing slash). Used for links in
      # emails, CORS, CSRF origin checks and the .ics links (which must be same-origin).
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false                  # set to the SAME value as APP_URL (UI and API share an origin)
      - key: CORS_ORIGINS
        sync: false                  # same value as APP_URL
      # Razorpay — test keys (rzp_test_…) for staging, live keys for production.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Google OAuth (Calendar + Meet). Redirect URI: <APP_URL>/api/v1/integrations/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Transactional email over SMTP (Amazon SES, Postmark, SendGrid, Resend, …)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"               # STARTTLS on 587; use "true" with port 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false                  # e.g. TeachMe <no-reply@teachme.in>
      - key: SUPPORT_EMAIL
        sync: false

databases:
  - name: teachme-db
    region: singapore
    plan: basic-1gb
    postgresMajorVersion: "16"
    databaseName: teachme
    user: teachme
    ipAllowList: []                  # private network only

services:
  - type: keyvalue
    name: teachme-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []                  # private network only

  - type: web
    name: teachme-api
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - fromGroup: teachme-backend-shared
      - key: PORT
        value: "4000"
      # Render load balancer → Next.js proxy → API: two trusted hops before the client IP.
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: teachme-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teachme-redis
          property: connectionString

  - type: worker
    name: teachme-worker
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: teachme-backend-shared
      - key: DATABASE_URL
        fromDatabase:
          name: teachme-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teachme-redis
          property: connectionString

  - type: web
    name: teachme-web
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      # Private address of the API (host:port). Used at build time for the /api proxy and at
      # runtime for server-side public data. Never exposed to browsers.
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: teachme-api
          property: hostport
      - key: NEXT_PUBLIC_APP_URL
        sync: false                  # same value as APP_URL
